<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130" role="img" aria-label="p.s. I already placed lava next to your bed.">
<style>.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.l{transform:scaleY(var(--h));transform-box:fill-box;transform-origin:50% 100%;animation:lv 1.6s infinite steps(4,end)}
