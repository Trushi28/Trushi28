</g>
<text class="m r" x="450" y="128" text-anchor="middle" font-size="64" font-weight="800" textLength="660" lengthAdjust="spacing" fill="#ff3b5c" opacity=".85">TRUSHI BETHU</text>
<text class="m c" x="450" y="128" text-anchor="middle" font-size="64" font-weight="800" textLength="660" lengthAdjust="spacing" fill="#22d3ee" opacity=".85">TRUSHI BETHU</text>
<text class="m " x="450" y="128" text-anchor="middle" font-size="64" font-weight="800" textLength="660" lengthAdjust="spacing" fill="#e6edf3" >TRUSHI BETHU</text>
<g clip-path="url(#b1)"><g class="s1"><text class="m " x="450" y="128" text-anchor="middle" font-size="64" font-weight="800" textLength="660" lengthAdjust="spacing" fill="#e6edf3" >TRUSHI BETHU</text></g></g>
<g clip-path="url(#b2)"><g class="s2"><text class="m " x="450" y="128" text-anchor="middle" font-size="64" font-weight="800" textLength="660" lengthAdjust="spacing" fill="#aab4c0" >TRUSHI BETHU</text></g></g>
<text class="m" x="450" y="170" text-anchor="middle" font-size="15" fill="#7d8896" textLength="540" lengthAdjust="spacing">systems · compilers · kernels · things nobody asked for</text>
<g class="m" font-size="11" letter-spacing="2">
<text x="70" y="214" fill="#aab4c0">ORDER</text>
<rect x="140" y="206" width="250" height="8" fill="#1a1f26"/>
