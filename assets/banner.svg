<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Trushi Bethu. Systems, compilers, kernels, things nobody asked for.">
<style>.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.r{animation:gr 5s infinite steps(1,end)}
.c{animation:gc 5s infinite steps(1,end)}
.s1{animation:s1 5s infinite steps(1,end)}
.s2{animation:s2 5s infinite steps(1,end)}
.t1{animation:t1 5s infinite steps(1,end)}
.t2{opacity:0;animation:t2 5s infinite steps(1,end)}
.scan{animation:scan 6s linear infinite}
.ord{transform:scaleX(.55);transform-box:fill-box;transform-origin:0 50%;animation:ord 9s infinite steps(22,end)}
.cha{transform:scaleX(.45);transform-box:fill-box;transform-origin:0 50%;animation:cha 9s infinite steps(22,end)}
.blink{animation:blink 1.1s infinite steps(1,end)}
@keyframes gr{0%,89%{transform:translate(0,0)}90%{transform:translate(-7px,1px)}92%{transform:translate(6px,-1px)}94%{transform:translate(-3px,0)}96%,100%{transform:translate(0,0)}}
@keyframes gc{0%,89%{transform:translate(0,0)}90%{transform:translate(7px,-1px)}93%{transform:translate(-6px,1px)}95%{transform:translate(3px,0)}97%,100%{transform:translate(0,0)}}
@keyframes s1{0%,89%{transform:translateX(0)}90%{transform:translateX(34px)}92%{transform:translateX(-26px)}95%{transform:translateX(12px)}97%,100%{transform:translateX(0)}}
@keyframes s2{0%,90%{transform:translateX(0)}91%{transform:translateX(-40px)}93%{transform:translateX(22px)}96%{transform:translateX(-8px)}98%,100%{transform:translateX(0)}}
@keyframes t1{0%,89%{opacity:1}90%,96%{opacity:0}97%,100%{opacity:1}}
@keyframes t2{0%,89%{opacity:0}90%,96%{opacity:1}97%,100%{opacity:0}}
@keyframes scan{0%{transform:translateY(-4px)}100%{transform:translateY(254px)}}
@keyframes ord{0%{transform:scaleX(1)}85%{transform:scaleX(.1)}100%{transform:scaleX(1)}}
@keyframes cha{0%{transform:scaleX(.1)}85%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
<defs>
<pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20,0 H0 V20" fill="none" stroke="#14181e" stroke-width="1"/></pattern>
<clipPath id="b1"><rect x="0" y="104" width="900" height="12"/></clipPath>
<clipPath id="b2"><rect x="0" y="132" width="900" height="9"/></clipPath>
</defs>
<rect width="900" height="250" rx="6" fill="#0b0d10" stroke="#2a3038"/>
<rect width="900" height="250" rx="6" fill="url(#g)"/>
